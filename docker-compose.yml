services:
  database:
    image: postgis/postgis:15-3.3-alpine
    container_name: c2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: c2_tactical
      POSTGRES_USER: nato_operator
      POSTGRES_PASSWORD: operator_secret
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nato_operator -d c2_tactical"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: c2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion-service:
    build:
      context: ./backend-ingestion
    container_name: c2-ingestion
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://nato_operator:operator_secret@database:5432/c2_tactical"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
  c2-core-java:
    build:
      context: ./backend-core-java
    container_name: c2-core-java
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://database:5432/c2_tactical"
      SPRING_DATASOURCE_USERNAME: "nato_operator"
      SPRING_DATASOURCE_PASSWORD: "operator_secret"
    depends_on:
      database:
        condition: service_healthy
  c2-frontend:
    build:
      context: ./frontend-cop
    container_name: c2-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - c2-core-java
volumes:
  pgdata: