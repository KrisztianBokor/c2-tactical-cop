
services:
  database:
    image: postgis/postgis:15-3.3-alpine
    container_name: c2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: c2_tactical
      POSTGRES_USER: nato_operator
      POSTGRES_PASSWORD: operator_secret
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nato_operator -d c2_tactical"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: c2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: