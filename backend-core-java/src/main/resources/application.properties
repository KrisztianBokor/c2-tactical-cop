spring.application.name=c2-core-service
server.port=8080

spring.datasource.url=jdbc:postgresql://database:5432/c2_tactical
spring.datasource.username=nato_operator
spring.datasource.password=operator_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# Let PostgreSQL/init script manage the DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false